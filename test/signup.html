<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="포트폴리오 계정 회원가입">
  <title>Sign Up — Still Building</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <a class="logo" href="index.html">STILL<span>.</span></a>
    <span class="header-spacer" aria-hidden="true"></span>
    <a class="contact" href="auth.html">BACK TO LOGIN ↗</a>
  </header>

  <main class="auth-page signup-page">
    <section class="auth-intro">
      <p class="status"><i></i> CREATE ACCOUNT</p>
      <h1>새로운 계정을<br><em>만들어보세요.</em></h1>
      <p>입력한 정보는 계정 관리와<br>서비스 경험을 위해 사용됩니다.</p>
    </section>

    <section class="auth-panel" aria-live="polite">
      <div class="auth-setup" id="auth-setup" hidden><span>SETUP REQUIRED</span><p>현재 인증 서버 연결 전입니다. Supabase 연결 값을 설정하면 아래 회원가입이 활성화됩니다.</p></div>
      <div class="auth-heading"><span>SIGN UP</span><a href="auth.html">이미 계정이 있나요? 로그인 ↗</a></div>
      <form id="signup-form" class="auth-form signup-form">
        <label>EMAIL<input name="email" type="email" autocomplete="email" placeholder="name@example.com" required></label>
        <div class="form-row"><label>PASSWORD<input name="password" type="password" autocomplete="new-password" minlength="6" placeholder="6자 이상 입력" required></label><label>PASSWORD CONFIRM<input name="passwordConfirm" type="password" autocomplete="new-password" minlength="6" placeholder="비밀번호 다시 입력" required></label></div>
        <div class="form-row"><label>BIRTH YEAR<input name="birthYear" type="number" inputmode="numeric" min="1900" max="2026" placeholder="예: 2000" required></label><label>GENDER<select name="gender" required><option value="">선택</option><option value="female">여성</option><option value="male">남성</option><option value="prefer_not_to_say">응답하지 않음</option></select></label></div>
        <label>REGION<input name="region" type="text" autocomplete="address-level1" maxlength="50" placeholder="예: 서울특별시" required></label>
        <label class="consent"><input name="consent" type="checkbox" required><span>회원가입을 위한 개인정보 수집 및 이용에 동의합니다.</span></label>
        <button class="auth-submit" type="submit">회원가입 ↗</button>
      </form>
      <p class="auth-message" id="auth-message" role="status"></p>
    </section>
  </main>

  <footer><a class="logo" href="index.html">STILL<span>.</span></a><p>MADE WITH CURIOSITY<br>AND VIBE CODING</p><div><a href="https://github.com/tjgkwls01">GITHUB ↗</a><a href="index.html">HOME ↗</a></div><small>© 2026 STILL BUILDING</small></footer>
  <script type="module" src="./signup.js"></script>
</body>
</html>
